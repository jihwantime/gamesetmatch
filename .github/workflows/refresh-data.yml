name: Weekly data refresh

# Re-runs the ETL + models and pushes an incremental update to the production D1
# database. Mondays 07:00 UTC — the ATP publishes new rankings on Mondays and
# tennis-data.co.uk posts the previous week's results by then.
#
# Requires a repository secret CLOUDFLARE_API_TOKEN (see DEPLOY.md).
# No Worker redeploy is needed: the Worker reads D1 live, so fresh rows are
# served immediately.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: # lets you run it on demand from the Actions tab

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so the per-step `if:` guards can read them -- a step cannot see
    # env it defines on itself. A missing secret skips that target rather than
    # failing the run, so either database can be refreshed on its own.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download source data
        run: python etl/download.py

      - name: Fetch current season results
        run: python etl/fetch_recent.py

      # never fails the run: falls back to the archive snapshot alone
      - name: Fetch live ATP top 20
        run: python etl/fetch_live_rankings.py

      - name: Train per-match performance ratings
        run: python ml/train_rating.py

      - name: Compute Elo ratings
        run: python ml/train_elo.py

      - name: Build incremental SQL
        run: python etl/build_delta.py

      - name: Apply to production D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute gamesetmatch --remote -y --file=etl/out/delta.sql

      # The Vercel site reads Postgres, not D1, so it needs its own load or it
      # silently freezes at whatever was last pushed by hand. This is a full
      # TRUNCATE + COPY reload rather than a delta -- it is only ~80k matches,
      # and it keeps the two databases from drifting apart.
      - name: Refresh production Postgres
        if: env.DATABASE_URL != ''
        run: python etl/load_postgres.py

      - name: Report freshness
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo '### Cloudflare D1' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler d1 execute gamesetmatch --remote -y --json --command \
              "SELECT key, value FROM meta ORDER BY key" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$DATABASE_URL" ]; then
            echo '### Postgres (Vercel)' >> "$GITHUB_STEP_SUMMARY"
            python etl/report_freshness.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi
